        const tagOptions = {
          context: ["Eating", "Noticing", "Procrastinating", "Ruminating", "Scrolling", "Vaping", "Working", "Socializing"],
          physical: ["Chest tightness", "Fast heartbeat", "Heavy breathing", "Relaxed", "Tense shoulders", "Stomach knot", "Heavy", "Light"],
          needs: ["Rest", "Reassurance", "Space", "Connection", "Water", "Movement", "Quiet", "Validation"]
        };

        // --- Color Helpers ---
        const getEmotionColors = (path) => {
          if (!path || path.length === 0) return { strong: '#94a3b8' };
          const core = emotionData.find(e => e.name === path[0]);
          if (!core) return { strong: '#94a3b8' };
          return { strong: `hsl(${core.hue}, ${core.sat}%, ${core.lit}%)` };
        };

        const getCircleColor = (path, index) => {
          if (!path || path.length === 0) return '#94a3b8';
          const core = emotionData.find(e => e.name === path[0]);
          if (!core) return '#94a3b8';
          
          let lightness = core.lit;
          if (index === 1) lightness += 15;
          
          return `hsl(${core.hue}, ${core.sat}%, ${lightness}%)`;
        };

        // --- Math and SVG Helpers for Wheel ---
        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
          const angleInRadians = (angleInDegrees - 90) * (Math.PI / 180.0);
          return { x: centerX + (radius * Math.cos(angleInRadians)), y: centerY + (radius * Math.sin(angleInRadians)) };
        }

        function describeArc(x, y, innerRadius, outerRadius, startAngle, endAngle) {
          const startInner = polarToCartesian(x, y, innerRadius, endAngle);
          const endInner = polarToCartesian(x, y, innerRadius, startAngle);
          const startOuter = polarToCartesian(x, y, outerRadius, endAngle);
          const endOuter = polarToCartesian(x, y, outerRadius, startAngle);
          const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
          return ["M", startOuter.x, startOuter.y, "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOuter.x, endOuter.y, "L", endInner.x, endInner.y, "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startInner.x, startInner.y, "Z"].join(" ");
        }

        // --- Shared Definition List Component ---
        const RenderDefinitions = ({ paths, onTruncate }) => (
          <div className="flex flex-col gap-4 mt-2 border-t border-slate-100 dark:border-slate-800 pt-4 w-full animate-in fade-in slide-in-from-top-2">

                      </div>
                    </div>
                    <button 
                      onClick={(e) => { e.preventDefault(); e.stopPropagation(); onTruncate(pathIndex, levelIndex); }} 
                      className="absolute right-0 top-0 w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-700 active:bg-red-50 dark:active:bg-red-900/30 text-slate-400 dark:text-slate-400 active:text-red-500 flex items-center justify-center transition-colors"

        // --- Component: Emotion Wheel Explorer ---
        function EmotionWheelView({ initialPaths, onComplete, onCancel }) {
          const [selectedPaths, setSelectedPaths] = useState(initialPaths || []);
          const [isMultiSelect, setIsMultiSelect] = useState(initialPaths && initialPaths.length > 1);
          const [rotation, setRotation] = useState(0);
          const [isManual, setIsManual] = useState(false);
          const [isZoomedOut, setIsZoomedOut] = useState(true);
          const [isExpanded, setIsExpanded] = useState(false);
          
          const dragRef = useRef({ isDown: false, startAtan: 0, startRotation: 0 });
          const clickStartRef = useRef({ x: 0, y: 0 });
          const svgRef = useRef(null);
          
          const viewBoxSize = 1000; 
          const center = viewBoxSize / 2;
          const innerRadius = 80;
          const ringWidth = 140; 

          const baseSlices = useMemo(() => {
            let result = [];
            const totalCoreAngle = 360 / emotionData.length;
            function traverse(node, startAngle, endAngle, level, path, coreData) {
              const currentPath = [...path, node.name];
              
              let lightness = coreData.lit;
              if (level === 1) lightness += 15;
              const color = `hsl(${coreData.hue}, ${coreData.sat}%, ${lightness}%)`;
              
              const rInner = innerRadius + (level * ringWidth);
              const rOuter = innerRadius + ((level + 1) * ringWidth);
              
              result.push({ 
                id: currentPath.join("-"), name: node.name, level, path: currentPath, 
                startAngle, endAngle, innerRadius: rInner, outerRadius: rOuter, color
              });
              
              if (node.children && node.children.length > 0) {
                const span = (endAngle - startAngle) / node.children.length;
                let childStart = startAngle;
                node.children.forEach((child) => { 
                  traverse(child, childStart, childStart + span, level + 1, currentPath, coreData); 
                  childStart += span; 
                });
              }
            }
            let start = 0;
            emotionData.forEach(coreEmotion => { 
              traverse(coreEmotion, start, start + totalCoreAngle, 0, [], coreEmotion); 
              start += totalCoreAngle; 
            });
            return result;
          }, []);

          const focusOnPath = (path) => {
            if (path.length === 0) return;
            const activeSlice = baseSlices.find(s => s.name === path[path.length - 1]);
            if (!activeSlice) return;

            const midAngle = activeSlice.startAngle + (activeSlice.endAngle - activeSlice.startAngle) / 2;
            let targetRotation = 90 - midAngle;
            
            let delta = targetRotation - rotation;
            delta = ((delta + 180) % 360 + 360) % 360 - 180;
            
            setIsManual(false); 
            setRotation(rotation + delta);
          };

          const handleSliceClick = (slice) => {
            const existingIndex = selectedPaths.findIndex(p => p.join('-') === slice.path.join('-'));
            let newPaths = [...selectedPaths];

            if (isMultiSelect) {
              if (existingIndex !== -1) {
                newPaths = newPaths.filter((_, i) => i !== existingIndex);
              } else {
                const filtered = newPaths.filter(p => !p.join('-').startsWith(slice.path.join('-')) && !slice.path.join('-').startsWith(p.join('-')));
                newPaths = [...filtered, slice.path];
              }
            } else {
              newPaths = existingIndex !== -1 ? [] : [slice.path];
            }
            
            setSelectedPaths(newPaths);

            if (newPaths.length > 0) {
              if (isZoomedOut) setIsZoomedOut(false);
              setTimeout(() => focusOnPath(slice.path), 50);
            }
          };

          const truncatePath = (pathIndex, levelIndex) => {
            setSelectedPaths(prev => {
              const newPaths = [...prev];
              if (levelIndex === 0) newPaths.splice(pathIndex, 1);
              else newPaths[pathIndex] = newPaths[pathIndex].slice(0, levelIndex);
              
              const uniquePaths = [];
              newPaths.forEach(p => {
                if (!uniquePaths.some(up => up.join('-') === p.join('-'))) uniquePaths.push(p);
              });
              return uniquePaths;
            });
          };

          const removePath = (pathId) => {
            setSelectedPaths(prev => prev.filter(p => p.join('-') !== pathId));
          };

          const handlePointerDown = (e) => {
            clickStartRef.current = { x: e.clientX, y: e.clientY };
            if (e.button !== 0 && e.type !== 'touchstart') return;
            
            const rect = svgRef.current.getBoundingClientRect();
            const centerX = rect.left + (rect.width / 2); 
            const centerY = rect.top + (rect.height / 2);
            
            const x = e.clientX - centerX;
            const y = e.clientY - centerY;
            const atan = Math.atan2(y, x) * 180 / Math.PI;

            dragRef.current = { isDown: true, startAtan: atan, startRotation: rotation };
          };

          const handlePointerMove = (e) => {
            if (!dragRef.current.isDown) return;
            setIsManual(true);

            const rect = svgRef.current.getBoundingClientRect();
            const centerX = rect.left + (rect.width / 2);
            const centerY = rect.top + (rect.height / 2);
            
            const x = e.clientX - centerX;
            const y = e.clientY - centerY;
            
            let currentAtan = Math.atan2(y, x) * 180 / Math.PI;
            let delta = currentAtan - dragRef.current.startAtan;
            
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            setRotation(dragRef.current.startRotation + delta);
          };

          const handlePointerUp = () => { dragRef.current.isDown = false; };

          useEffect(() => {
            if (initialPaths && initialPaths.length > 0) {
              setIsZoomedOut(false);
              focusOnPath(initialPaths[initialPaths.length - 1]);
            } else {
              setIsZoomedOut(true);
              setRotation(0);
            }
          }, []);

          const wheelClasses = isZoomedOut 
            ? 'left-1/2 -translate-x-1/2 w-[95%] sm:w-[85%] max-w-[650px]' 
            : 'left-0 -translate-x-1/2 w-[180%] sm:w-[140%] max-w-[1400px]';

          return (
            <div className="w-full max-w-4xl mx-auto flex flex-col gap-6 animate-in fade-in duration-300">
              <div className="flex flex-col items-start justify-center mb-2 mt-2 px-2">
                <h1 className="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight transition-colors">How are you feeling?</h1>
                <p className="text-slate-500 dark:text-slate-400 mt-1 transition-colors">Chart your emotions on the Feelings Wheel.</p>
              </div>

              <div className="flex items-center gap-3 justify-center w-full">
                <button 
                  onClick={() => setIsZoomedOut(true)} 
                  className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shadow-sm ${isZoomedOut ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900' : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 active:bg-slate-50 dark:active:bg-slate-700'}`}
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="9"/></svg>
                  Full View
                </button>
                <button 
                  onClick={() => setIsZoomedOut(false)} 
                  className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shadow-sm ${!isZoomedOut ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900' : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 active:bg-slate-50 dark:active:bg-slate-700'}`}
                >

                  className={`absolute top-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing drop-shadow-xl transition-all duration-700 ease-in-out ${wheelClasses}`} 
                  onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} 
                  onPointerUp={handlePointerUp} onPointerLeave={handlePointerUp}
                  style={{ touchAction: 'none' }}
                >
                  <g style={{ 
                    transform: `rotate(${rotation}deg)`, 
                    transformOrigin: `${center}px ${center}px`,
                    transition: isManual ? 'none' : 'transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)' 
                  }}>
                    {baseSlices.map((slice) => {
                      const isSelected = selectedPaths.some(p => p.join('-') === slice.path.join('-') || p.join('-').startsWith(slice.path.join('-') + '-'));
                      const fill = isSelected ? "#e2e8f0" : slice.color;
                      const textFill = isSelected ? "#0f172a" : "#ffffff";
                      const midAngle = slice.startAngle + (slice.endAngle - slice.startAngle) / 2;
                      const textPos = polarToCartesian(center, center, slice.innerRadius + (ringWidth) / 2, midAngle);
                      const textRotation = midAngle - 90; 

                      return (
                        <g key={slice.id}>
                          <path 
                            d={describeArc(center, center, slice.innerRadius, slice.outerRadius, slice.startAngle, slice.endAngle)} 
                            fill={fill} stroke="white" strokeWidth="1.5" 
                            className="transition-colors duration-300 cursor-pointer"
                            onClick={(e) => { 
                              e.stopPropagation(); 
                              if (Math.hypot(e.clientX - clickStartRef.current.x, e.clientY - clickStartRef.current.y) > 5) return; 
                              handleSliceClick(slice); 
                            }}
                          />
                          <text 
                            x={textPos.x} y={textPos.y} 
                            fill={textFill} 
                            fontSize={slice.level === 0 ? "22" : (slice.level === 1 ? "16" : "13")} 
                            fontWeight="600" textAnchor="middle" alignmentBaseline="middle" pointerEvents="none" 
                            transform={`rotate(${textRotation}, ${textPos.x}, ${textPos.y})`} 
                            className="transition-colors duration-300 drop-shadow-sm"
                          >
                            {slice.name}
                          </text>
                        </g>
                      );

        // --- Component: Reflection Tagging Flow ---
        function ReflectionView({ draft, setDraft, onSave, onCancel, onBack, isEditing, onDelete, onEditEmotions }) {
          const [isExpanded, setIsExpanded] = useState(false);
          const [confirmDelete, setConfirmDelete] = useState(false);

          const toggleTag = (category, tag) => {
            setDraft(prev => {
              const tags = prev[category].tags;
              const newTags = tags.includes(tag) ? tags.filter(t => t !== tag) : [...tags, tag];
              return { ...prev, [category]: { ...prev[category], tags: newTags } };
            });
          };

          const updateText = (category, text) => {
            setDraft(prev => ({ ...prev, [category]: { ...prev[category], text } }));
          };

          const truncatePath = (pathIndex, levelIndex) => {
            setDraft(prev => {
              const newPaths = [...prev.emotionPaths];
              if (levelIndex === 0) newPaths.splice(pathIndex, 1);
              else newPaths[pathIndex] = newPaths[pathIndex].slice(0, levelIndex);
              
              const uniquePaths = [];
              newPaths.forEach(p => {
                if (!uniquePaths.some(up => up.join('-') === p.join('-'))) uniquePaths.push(p);
              });
              return { ...prev, emotionPaths: uniquePaths };
            });
          };

          const displayDate = draft.date ? new Date(draft.date) : new Date();

          const handleDelete = () => {
            if (!confirmDelete) {
              setConfirmDelete(true);
              setTimeout(() => setConfirmDelete(false), 3000);
              return;
            }
            onDelete();
          };

                  </div>
                )}

                <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-slate-50 dark:from-slate-900 via-slate-50 dark:via-slate-900 to-transparent pointer-events-none transition-colors">
                  <div className="max-w-2xl mx-auto pointer-events-auto">
                    <button 
                      onClick={() => { setDraft(getEmptyDraft()); setEditingId(null); setCurrentView('wheel'); }}
                      className="w-full flex items-center justify-center gap-2 py-4 px-6 rounded-2xl text-white dark:text-slate-900 bg-black dark:bg-slate-100 active:bg-slate-800 dark:active:bg-slate-300 transition-all font-bold shadow-xl"
                    >
                      <Plus size={20} strokeWidth={3} /> New Entry
                    </button>
                  </div>
                </div>
              </div>
            );
          };

          const renderStats = () => {
            const sortedEntries = [...entries].sort((a,b) => a.date - b.date);
            const hasData = sortedEntries.length > 0;
            
            const coreOrder = ["Angry", "Bad", "Disgusted", "Fearful", "Happy", "Sad", "Surprised"];
            const graphHeight = 260;
            const yStep = graphHeight / (coreOrder.length - 1);
            
            const now = new Date();
            const minTime = hasData ? sortedEntries[0].date.getTime() : now.getTime();
            const maxTime = hasData ? sortedEntries[sortedEntries.length-1].date.getTime() : now.getTime();
            const timeRange = maxTime - minTime || 86400000; 

            const points = [];
            sortedEntries.forEach((e) => {
              const xPercent = sortedEntries.length > 1 ? (e.date.getTime() - minTime) / timeRange : 0.5;
              const xPos = xPercent * 100;

              e.emotionPaths.forEach(path => {
                const core = path[0];
                const yIndex = coreOrder.indexOf(core);
                if (yIndex !== -1) {
                  points.push({ x: xPos, y: yIndex * yStep, entry: e, color: getEmotionColors([core]).strong });
                }
              });
            });

            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const mtdEntries = entries.filter(e => e.date >= startOfMonth);
            const mtdCounts = {};
            mtdEntries.forEach(e => {
              e.emotionPaths.forEach(path => {
                const core = path[0];
                if (core) mtdCounts[core] = (mtdCounts[core] || 0) + 1;
              });
            });

            const sortedMtd = Object.entries(mtdCounts).sort((a,b) => a[0].localeCompare(b[0]));

            return (
              <div className="max-w-2xl mx-auto w-full flex flex-col min-h-[90vh] animate-in fade-in duration-300 pb-32">
                <div className="flex items-center justify-between mb-6 px-2 mt-2">
                  <div>
                    <h1 className="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight transition-colors">What are your trends?</h1>
                    <p className="text-slate-500 dark:text-slate-400 mt-1 transition-colors">Visualize your emotional journey.</p>
                  </div>
                </div>

                <div className="flex bg-slate-200/50 dark:bg-slate-700/50 p-1 rounded-xl mb-8 transition-colors">
                  <button onClick={() => setCurrentView('journal')} className="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 dark:text-slate-400 active:text-slate-700 dark:active:text-slate-200 transition-colors">Journal</button>
                  <button className="flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-white transition-colors">Stats and Trends</button>
                </div>

                <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 mb-8 overflow-hidden transition-colors">
                  <h2 className="text-sm uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 mb-6 flex items-center gap-2">
                    <LineChart size={16} /> Core Emotions Timeline
                  </h2>
                  
                  {hasData ? (
                    <div className="relative w-full flex" style={{ height: graphHeight + 40 }}>
                      <div className="w-20 flex flex-col justify-between shrink-0 h-full pb-10">
                        {coreOrder.map((core) => (
                          <div key={core} className="text-xs font-bold text-slate-400 dark:text-slate-500 h-0 flex items-center">{core}</div>
                        ))}
                      </div>
                      
                      <div className="flex-1 relative h-full pb-10">
                        {coreOrder.map((_, i) => (
                          <div key={i} className="absolute w-full border-b border-slate-200 dark:border-slate-700 border-dashed transition-colors" style={{ top: i * yStep }} />
                        ))}
                        
                        <svg className="absolute inset-0 w-full h-full overflow-visible">
                          <polyline points={points.map(p => `${p.x}%,${p.y}`).join(' ')} fill="none" stroke="#94a3b8" strokeWidth="3" strokeLinejoin="round" />
                          {points.map((p, i) => (
                            <circle 
                              key={i} cx={`${p.x}%`} cy={p.y} r="6" fill={p.color} stroke="white" strokeWidth="2"
                              className="cursor-pointer active:r-[8px] transition-all drop-shadow-sm"
                              onClick={() => { setDraft(p.entry); setEditingId(p.entry.id); setCurrentView('reflection'); }}
                            />
                          ))}
                        </svg>

                        <div className="absolute bottom-0 w-full flex justify-between text-xs font-bold text-slate-400 dark:text-slate-500 pt-2 border-t border-slate-200 dark:border-slate-700 transition-colors">
                          <span>{new Date(minTime).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span>
                          {sortedEntries.length > 1 && <span>{new Date(maxTime).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span>}
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="h-48 flex items-center justify-center text-slate-400 dark:text-slate-500 font-medium transition-colors">Not enough data to graph yet.</div>
                  )}
                </div>

                <div>
                  <h2 className="text-sm uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 mb-4 flex items-center gap-2 px-2 transition-colors">
                    <Calendar size={16} /> Month to Date Totals
                  </h2>
                  
                  {sortedMtd.length > 0 ? (
                    <div className="flex flex-col gap-3">
                      {sortedMtd.map(([emotion, count]) => {
                        const colors = getEmotionColors([emotion]);
                        return (
                          <button 
                            key={emotion}
                            onClick={() => { setFilterEmotion(emotion); setCurrentView('journal'); }}
                            className="flex items-center justify-between px-5 py-4 rounded-2xl border transition-all active:shadow-md w-full bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700"
                          >
                            <div className="flex items-center gap-3">
                              <div className="w-4 h-4 rounded-full shadow-sm" style={{ backgroundColor: colors.strong }}></div>
                              <span className="font-bold text-lg text-slate-800 dark:text-slate-100 transition-colors">{emotion}</span>
                            </div>
                            <span className="flex items-center justify-center w-8 h-8 rounded-full text-sm font-black text-white shadow-sm" style={{ backgroundColor: colors.strong }}>{count}</span>
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <p className="text-slate-500 dark:text-slate-400 px-2 transition-colors">No entries recorded this month.</p>
                  )}
                </div>
              </div>
            );
          };

          return (
            <div className={`min-h-screen font-sans flex flex-col ${isDarkMode ? 'dark' : ''}`}>
              <div className="flex-1 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 p-4 md:p-8 selection:bg-slate-800 dark:selection:bg-slate-200 selection:text-white dark:selection:text-slate-900 transition-colors duration-300">
                
                {/* Global Dark Mode Toggle */}
                <button 
                  onClick={() => setIsDarkMode(!isDarkMode)} 
                  className="fixed top-4 right-4 sm:top-8 sm:right-8 p-3 rounded-full bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 shadow-sm border border-slate-200 dark:border-slate-700 z-50 transition-all hover:scale-105 active:scale-95"
                  title="Toggle Dark Mode"
                >
                  {isDarkMode ? <Sun size={20} strokeWidth={2.5} /> : <Moon size={20} strokeWidth={2.5} />}
                </button>

                {currentView === 'journal' && renderJournalLog()}
                {currentView === 'stats' && renderStats()}
                
                {currentView === 'wheel' && (
                  <EmotionWheelView 
                    initialPaths={draft.emotionPaths} 
                    onCancel={() => {
                      setDraft(getEmptyDraft());
                      setEditingId(null);
                      setCurrentView('journal');
                    }}
                    onComplete={(paths) => {
                      setDraft({ ...draft, emotionPaths: paths });
                      setCurrentView('reflection');
                    }} 
                  />
                )}
                
                {currentView === 'reflection' && (
                  <ReflectionView 
                    draft={draft}
                    setDraft={setDraft}
                    isEditing={editingId !== null}
                    onEditEmotions={() => setCurrentView('wheel')}
                    onBack={() => setCurrentView('wheel')}
                    onCancel={() => {
                      setDraft(getEmptyDraft());
                      setEditingId(null);
                      setCurrentView('journal');
                    }}
                    onDelete={() => {
                      setEntries(prev => prev.filter(e => e.id !== editingId));
                      setDraft(getEmptyDraft());
                      setEditingId(null);
                      setCurrentView('journal');
                    }}
                    onSave={() => {
                      if (editingId !== null) {
                        setEntries(prev => prev.map(e => e.id === editingId ? { ...draft, date: e.date } : e));
                      } else {
                        setEntries(prev => [...prev, { ...draft, id: Date.now(), date: new Date() }]);
                      }
                      setDraft(getEmptyDraft());
                      setEditingId(null);
                      setCurrentView('journal');
                    }}
                  />
                )}
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
